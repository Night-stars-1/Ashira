name: Release

# Publishing a GitHub Release builds every target and attaches the files to it.
# Running it by hand builds the same files as workflow artifacts, without a release; with
# `release` set (e.g. v0.2.10) it only rebuilds that release's image from its attached files.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Rebuild only the Docker image of this published release (e.g. v0.2.10)
        required: false
        default: ''

permissions:
  contents: write

env:
  # Tag like v1.2.3 → 1.2.3; manual runs use the version in the manifests.
  VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release || '' }}
  # Set on a manual image-only rebuild: the release whose attached files go into the image.
  IMAGE_ONLY: ${{ inputs.release || '' }}

jobs:
  core:
    if: inputs.release == '' || inputs.release == null
    name: ashira-core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: ashira }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, bin: ashira.exe }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, bin: ashira }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - name: Version from tag
        if: env.VERSION != ''
        shell: bash
        env:
          V: ${{ github.event.release.tag_name }}
        run: |
          # The binary reports and compares against CARGO_PKG_VERSION, so it must match the tag.
          # perl rather than sed: macOS ships BSD sed, which lacks `0,/re/`.
          perl -0pi -e '($v = $ENV{V}) =~ s/^v//; s/^version = "[^"]*"/version = "$v"/m' Cargo.toml
          perl -0pi -e '($v = $ENV{V}) =~ s/^v//; s/(^name = "ashira"\r?\nversion = )"[^"]*"/$1"$v"/m' Cargo.lock
          grep -m1 '^version' Cargo.toml
          grep -A1 '^name = "ashira"' Cargo.lock
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="ashira-core-${VERSION:-dev}-${{ matrix.name }}"
          mkdir -p dist/"$name"
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} README.md dist/"$name"/
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ashira-core-${{ matrix.name }}
          path: dist/*

  web:
    if: inputs.release == '' || inputs.release == null
    name: ashira-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - name: Package
        run: |
          name="ashira-web-${VERSION:-dev}"
          mkdir -p dist && cp -r web/dist "dist/$name"
          cd dist && zip -qr "$name.zip" "$name" && rm -r "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ashira-web
          path: dist/*

  app:
    if: inputs.release == '' || inputs.release == null
    name: ashira-app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android, os: ubuntu-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: macos-universal, os: macos-latest }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - if: matrix.name == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Linux packages
        if: matrix.name == 'linux-x64'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Version flags
        id: version
        run: |
          # Release builds take the tag's version; the run number keeps Android version codes increasing.
          if [ -n "$VERSION" ]; then echo "flags=--build-name=${VERSION#v} --build-number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      - name: Signing key
        if: matrix.name == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Every release APK must carry the same key, or it cannot update an installed one.
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ashira-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=ashira\n' "$RUNNER_TEMP/ashira-release.jks" "$PASSWORD" "$PASSWORD" > android/key.properties
      - name: Build APK
        if: matrix.name == 'android'
        run: |
          flutter build apk --release ${{ steps.version.outputs.flags }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/ashira-app-${VERSION:-dev}-android.apk"
          rm -f android/key.properties "$RUNNER_TEMP/ashira-release.jks"
      - name: Build Windows
        if: matrix.name == 'windows-x64'
        run: |
          flutter build windows --release ${{ steps.version.outputs.flags }}
          # A per-user Inno Setup installer; the App updates itself by running a newer one silently.
          # Inno Setup ships on the windows-latest image; choco installs it if that ever changes.
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || { choco install innosetup -y --no-progress > /dev/null && iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"; }
          version="${VERSION#v}"
          name="ashira-app-${VERSION:-dev}-windows-x64-setup"
          "$iscc" -Q "-DAppVersion=${version:-0.0.0}" "-DSourceDir=$(cygpath -w "$PWD/build/windows/x64/runner/Release")" "-DOutputName=$name" windows/installer/ashira.iss
          mkdir -p ../dist
          cp "windows/installer/Output/$name.exe" ../dist/
          # Portable zip as well: v0.2.10 and older update from `-windows-x64.zip` and would not see the installer.
          portable="ashira-app-${VERSION:-dev}-windows-x64"
          cp -r build/windows/x64/runner/Release "../dist/$portable"
          (cd ../dist && 7z a "$portable.zip" "$portable" > /dev/null && rm -r "$portable")
      - name: Build Linux
        if: matrix.name == 'linux-x64'
        run: |
          flutter build linux --release ${{ steps.version.outputs.flags }}
          # The bundle, plus install.sh and the menu entry it fills in.
          name="ashira-app-${VERSION:-dev}-linux-x64"
          mkdir -p "../dist/$name"
          cp -r build/linux/x64/release/bundle/. "../dist/$name/"
          cp linux/packaging/install.sh linux/packaging/dev.ashira.ashira_app.desktop "../dist/$name/"
          chmod +x "../dist/$name/install.sh" "../dist/$name/ashira_app"
          cd ../dist && tar czf "$name.tar.gz" "$name" && rm -r "$name"
      - name: Build macOS
        if: matrix.name == 'macos-universal'
        run: |
          # Flutter builds macOS apps universal (Apple Silicon and Intel) by default.
          flutter build macos --release ${{ steps.version.outputs.flags }}
          name="ashira-app-${VERSION:-dev}-macos-universal"
          app=build/macos/Build/Products/Release/Ashira.app
          # Not notarized: an ad-hoc signature lets Gatekeeper's "Open anyway" run it.
          codesign --force --deep --sign - "$app"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" ../dist
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Ashira -srcfolder "$stage" -ov -format UDZO "../dist/$name.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: ashira-app-${{ matrix.name }}
          path: dist/*

  publish:
    name: Attach to release
    if: github.event_name == 'release'
    needs: [core, web, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ github.event.release.tag_name }}" * --clobber -R "${{ github.repository }}"

  docker:
    name: ghcr.io image
    # Built from this run's linux-x64 core and web build, so it never compiles twice; an
    # image-only rebuild takes them from the published release instead.
    needs: [core, web]
    if: ${{ !cancelled() && (needs.core.result == 'success' && needs.web.result == 'success' || inputs.release != '' && inputs.release != null) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - if: env.IMAGE_ONLY == ''
        uses: actions/download-artifact@v8
        with:
          name: ashira-core-linux-x64
          path: artifacts/core
      - if: env.IMAGE_ONLY == ''
        uses: actions/download-artifact@v8
        with:
          name: ashira-web
          path: artifacts/web
      - name: Release files
        if: env.IMAGE_ONLY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$IMAGE_ONLY" -R "$GITHUB_REPOSITORY" -p 'ashira-core-*-linux-x64.tar.gz' -D artifacts/core
          gh release download "$IMAGE_ONLY" -R "$GITHUB_REPOSITORY" -p 'ashira-web-*.zip' -D artifacts/web
      - name: Context
        run: |
          # The image's build context holds only the binary and the page (see .dockerignore).
          mkdir -p context/web unpacked/core unpacked/web
          cp Dockerfile .dockerignore context/
          tar xzf artifacts/core/*.tar.gz -C unpacked/core
          cp unpacked/core/*/ashira context/ashira
          unzip -q artifacts/web/*.zip -d unpacked/web
          cp -r unpacked/web/*/. context/web/
          # The marker makes the core treat the page as its own release, not a hand copy.
          if [ -n "$VERSION" ]; then printf '%s' "${VERSION#v}" > context/web/.ashira-version; fi
          ls -la context context/web
          # GHCR repository names must be lower case; the owner here is not.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ashira" >> "$GITHUB_ENV"
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=latest,enable=${{ env.VERSION != '' }}
            type=sha,prefix=dev-,enable=${{ env.VERSION == '' }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: context
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION || 'dev' }}
