name: ashira_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: ^13.4.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  http: ^1.6.0
  image_picker: ^1.2.4
  markdown: ^7.3.1
  package_info_plus: ^10.2.2
  pasteboard: ^0.5.0
  path_provider: ^2.1.6
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  # 0.6 pulls in nativeapi's FFI bindings, which break Android release (AOT) builds.
  window_manager: ^0.5.2
  xterm: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
  # HarmonyOS Sans SC (Huawei, HarmonyOS Sans Fonts License: bundling allowed with a
  # notice, see assets/fonts/HarmonyOS_Sans_LICENSE.txt). Regular, Medium and Bold cover w400-w700.
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 600
    # CaskaydiaMono Nerd Font Mono (SIL OFL 1.1, see assets/fonts/CaskaydiaMono_LICENSE.txt):
    # the terminal's prompt icons on devices without the font installed.
    - family: Ashira Terminal
      fonts:
        - asset: assets/fonts/CaskaydiaMonoNerdFontMono-Regular.ttf
